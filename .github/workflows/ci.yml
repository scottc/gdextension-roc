# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      baseline-engine:
        description: "Baseline Engine (--baseline=..)"
        type: choice
        options:
          - godot
          - godot4.5
          - redot
          - rex
        default: godot
      optimize:
        description: "Optimize (-Doptimize=…)"
        type: choice
        options:
          - Debug
          - ReleaseFast
          - ReleaseSafe
          - ReleaseSmall
        default: Debug
      additional-engines:
        description: "Additional Engines (--engines=..)"
        type: choice # TODO: multiple choice
        options:
          - none
          - all
          - godot
          - godot4.5
          - redot
          - rex
        default: none
      cpuarchos:
        description: "CpuArch-OS Targets (default=auto detect local native os, --targets=..)"
        type: choice # TODO: multiple choice
        options: [auto, all, x64musl, wasm32] # TODO: add all cpuarch-os targets...
        default: auto
      tests:
        description: "Static tests (--tests=..)"
        type: choice # TODO: multiple choice
        options:
          - all
          - none
          - "roc check"
          - "zig test"
          - wasm-validate
          - wasm-ld
          - smoke
        default: all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      # TODO: can we get free $0, fast public flakehub binary cache?

      - name: Resolve CI args
        id: args
        run: |
          set -eux

          # Defaults for push / pull_request
          BASELINE="godot"
          ADDITIONAL=""
          CPUARCHOS="auto"
          OPTIMIZE="Debug"
          TESTS="all"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            # TODO: wire inputs into vars...
            # SOMEVAR="${{ inputs.somevar }}"

            BASELINE="godot"
            ADDITIONAL=""
            CPUARCHOS="auto"
            OPTIMIZE="Debug"
            TESTS="all"

          fi

          # TODO: wire args...
          # Build argv for: roc run scripts/ci.roc -- <args...>

          echo "argv=$*" >> "$GITHUB_OUTPUT"
          echo "Resolved: roc run scripts/ci.roc -- $*"

      - name: CI inside flake
        run: |
          set -eux
          # TODO: lean nix shells, pull only what's needed...
          if nix eval --raw .#devShells.x86_64-linux.ci >/dev/null 2>&1; then
            nix develop .#ci --command roc run scripts/ci.roc -- ${{ steps.args.outputs.argv }}
          else
            nix develop --command roc run scripts/ci.roc -- ${{ steps.args.outputs.argv }}
          fi

      # TODO: maybe publish bundle-out, if there isn't any penalty, or storage resource limits or costs.
      # - name: Upload artefacts
      #   if: always()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: ci-${{ github.run_id }}
      #     path: |
      #       smoke-out/
      #       bundle-out/
      #       platform-out/
      #     if-no-files-found: ignore
      #     retention-days: 7
