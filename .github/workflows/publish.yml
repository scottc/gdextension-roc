name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Empty = nightly-YYYY-MM-DD-<sha7>"
        type: string
        default: ""
      mode:
        type: choice
        options: [full, quick]
        default: full
      optimize:
        type: choice
        options: [Debug, ReleaseFast, ReleaseSafe, ReleaseSmall]
        default: ReleaseFast
      deep_wasm:
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build platforms (no upload yet)
        run: |
          set -eux
          MODE="${{ inputs.mode || 'full' }}"
          OPT="${{ inputs.optimize || 'ReleaseFast' }}"
          ARGS=("$MODE" "-Doptimize=${OPT}")
          if [ "${{ inputs.deep_wasm || true }}" = "true" ]; then
            ARGS+=(deep-wasm)
          fi
          # Build only; publish step below uploads .tar.zst files correctly.
          nix develop --command roc run scripts/ci.roc -- "${ARGS[@]}"

      - name: Publish GitHub release (multi-platform assets)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PUBLISH_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # Paste the shell block above.
          # If workflow_dispatch with empty tag, clear PUBLISH_TAG so nightly-* is used:
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -z "${{ inputs.tag }}" ]; then
            unset PUBLISH_TAG
          fi
          # ... then the publish script
          set -eu

          if [ -z "${GITHUB_TOKEN:-}" ]; then
            echo "[publish] GITHUB_TOKEN required" >&2
            exit 1
          fi
          if ! command -v gh >/dev/null 2>&1; then
            echo "[publish] gh CLI not found" >&2
            exit 1
          fi

          SHA="$(git rev-parse --short=7 HEAD)"
          if [ -n "${PUBLISH_TAG:-}" ]; then
            TAG="$PUBLISH_TAG"
          else
            TAG="nightly-$(date -u +%Y-%m-%d)-${SHA}"
          fi

          STAGING="release-assets"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"

          # Collect roc bundle artefacts; rename for human-readable multi-platform releases.
          # Original hash filename is preserved inside the new name for cache/debug.
          NOTES_FILE="$STAGING/NOTES.md"
          {
            echo "## godot-roc ${TAG}"
            echo
            echo "Commit: \`${SHA}\`"
            echo
            echo "### Platform URLs (paste into \`pf: platform \"…\"\`)"
            echo
          } >"$NOTES_FILE"

          ASSETS=()
          for eng in godot godot_4_5_1 redot; do
            # roc bundle writes the .tar.zst into the bundle workspace cwd
            shopt -s nullglob
            files=(bundle-out/"$eng"/workspace/*.tar.zst)
            shopt -u nullglob
            if [ "${#files[@]}" -eq 0 ]; then
              echo "[publish] warning: no .tar.zst for $eng" >&2
              continue
            fi
            src="${files[0]}"
            base="$(basename "$src" .tar.zst)"
            dest="$STAGING/${eng}-platform-${base}.tar.zst"
            cp -f "$src" "$dest"
            ASSETS+=("$dest")

            url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/$(basename "$dest")"
            {
              echo "- **${eng}**"
              echo
              echo "  \`${url}\`"
              echo
            } >>"$NOTES_FILE"
          done

          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "[publish] no platform bundles found" >&2
            exit 1
          fi

          echo "[publish] creating release $TAG with ${#ASSETS[@]} asset(s)"
          gh release create "$TAG" "${ASSETS[@]}" \
            --title "godot-roc $TAG" \
            --notes-file "$NOTES_FILE"

      # - uses: actions/upload-artifact@v4
      #   if: always()
      #   with:
      #     name: bundle-out-${{ github.run_id }}
      #     path: bundle-out/
      #     if-no-files-found: warn
      #     retention-days: 14
