name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Empty = nightly-YYYY-MM-DD-<sha7> (from publish.roc)"
        type: string
        default: ""
      optimize:
        type: choice
        options: [Debug, ReleaseFast, ReleaseSafe, ReleaseSmall]
        default: ReleaseFast
      targets:
        description: "Comma-separated hosts (start small; grow later)"
        type: string
        default: "x64musl,wasm32"
      baseline:
        type: string
        default: "godot4.5"
      engines:
        description: "Extra engines beyond baseline (comma-separated)"
        type: string
        default: "godot4.7,redot26.2"

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Resolve publish args
        id: meta
        shell: bash
        run: |
          set -euxo pipefail

          OPT="${{ inputs.optimize || 'ReleaseFast' }}"
          TARGETS="${{ inputs.targets || 'x64musl,wasm32' }}"
          BASELINE="${{ inputs.baseline || 'godot4.5' }}"
          ENGINES="${{ inputs.engines || 'godot4.7,redot26.2' }}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_IN="${{ inputs.tag }}"
          else
            # tag push: github.ref_name is the tag (e.g. v0.1.0-rc1)
            TAG_IN="${{ github.ref_name }}"
          fi

          {
            echo "optimize=${OPT}"
            echo "targets=${TARGETS}"
            echo "baseline=${BASELINE}"
            echo "engines=${ENGINES}"
          } >> "$GITHUB_OUTPUT"

          if [ -n "$TAG_IN" ]; then
            echo "tag_arg=--tag=${TAG_IN}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_arg=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build + publish (notes + gh release via publish.roc)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euxo pipefail

          OPT='${{ steps.meta.outputs.optimize }}'
          TARGETS='${{ steps.meta.outputs.targets }}'
          BASELINE='${{ steps.meta.outputs.baseline }}'
          ENGINES='${{ steps.meta.outputs.engines }}'
          TAG_ARG='${{ steps.meta.outputs.tag_arg }}'

          # Extra args after Task defaults; publish.roc owns notes + gh release create.
          # shellcheck disable=SC2086
          nix run github:lukewilliamboswell/roc-blueprint/0.5.0 -- run publish -- \
            --baseline="${BASELINE}" \
            --engines="${ENGINES}" \
            --targets="${TARGETS}" \
            -Doptimize="${OPT}" \
            ${TAG_ARG}
